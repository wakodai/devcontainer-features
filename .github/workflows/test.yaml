name: "CI - Test Features"
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test-autogenerated:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature:
          - agent-home
          - gh-release-tool
        baseImage:
          - mcr.microsoft.com/devcontainers/base:ubuntu
          - mcr.microsoft.com/devcontainers/base:debian
    steps:
      - uses: actions/checkout@v4

      - name: "Install the devcontainer CLI"
        run: npm install -g @devcontainers/cli

      # Feature はホストのファイルを bind マウントするので、マウント元がないとコンテナが起動しない
      - name: "Create a fake host home"
        run: test/fixtures/make-fake-home.sh "$RUNNER_TEMP/fakehome"

      - name: "Test ${{ matrix.feature }} on ${{ matrix.baseImage }}"
        run: HOME="$RUNNER_TEMP/fakehome" devcontainer features test --skip-scenarios -f "${{ matrix.feature }}" -i "${{ matrix.baseImage }}" .

  test-scenarios:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature:
          - agent-home
          - gh-release-tool
    steps:
      - uses: actions/checkout@v4

      - name: "Install the devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Create a fake host home"
        run: test/fixtures/make-fake-home.sh "$RUNNER_TEMP/fakehome"

      - name: "Test ${{ matrix.feature }} scenarios"
        run: HOME="$RUNNER_TEMP/fakehome" devcontainer features test -f "${{ matrix.feature }}" --skip-autogenerated .
